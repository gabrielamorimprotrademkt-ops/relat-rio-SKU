<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard SKU — Samsung Relatórios</title>
  <meta name="description" content="Dashboard visual de efetividade de coleta de SKU por bandeira de lojas Samsung." />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0F0F0F; /* BLACK PRO */
      --surface: #181818; 
      --surface2: #222222;
      --border: rgba(252,252,252,0.08); /* WHITE PRO with opacity */
      --accent-pink: #FF006C; /* PINK PRO */
      --accent-purple: #6A0AAA; /* PURPLE PRO */
      --accent-orange: #FD5003; /* ORANGE PRO */
      --grad-pro: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-pink) 50%, var(--accent-orange) 100%);
      
      --text: #FCFCFC; /* WHITE PRO */
      --muted: #a0a0a0;
      
      /* Status Semantics adapted to brand */
      --ok: #FF006C; /* PINK PRO */
      --warn: #FD5003; /* ORANGE PRO */
      --danger: #6A0AAA; /* PURPLE PRO */
      --radius: 16px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    h1, h2, h3, .kpi-label, th {
      font-family: 'Comfortaa', sans-serif;
      text-transform: uppercase;
    }

    /* ── TOP BAR ── */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      height: 46px; width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; }
    header p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #last-updated { font-size: 0.75rem; color: var(--muted); background: var(--surface); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); }
    #btn-export {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border); color: var(--text); font-size: 0.8rem; font-weight: 600;
      padding: 8px 18px; border-radius: 10px; cursor: pointer;
      transition: all .2s;
      font-family: 'Montserrat', sans-serif;
    }
    #btn-export:hover { border-color: var(--accent-pink); color: var(--accent-pink); }
    #btn-export:active { transform: scale(.97); }

    #btn-refresh {
      display: flex; align-items: center; gap: 6px;
      background: var(--grad-pro);
      border: none; color: #fff; font-size: 0.8rem; font-weight: 600;
      padding: 8px 18px; border-radius: 10px; cursor: pointer;
      transition: opacity .2s, transform .1s;
      font-family: 'Montserrat', sans-serif;
    }
    #btn-refresh:hover { opacity: .88; }
    #btn-refresh:active { transform: scale(.97); }
    #btn-refresh .spin { display: none; animation: spin .7s linear infinite; }
    #btn-refresh.loading .spin { display: inline-block; }
    #btn-refresh.loading .icon-refresh { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FILTERS ── */
    #filter-bar {
      padding: 16px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    #filter-bar label { font-size: .78rem; color: var(--muted); font-weight: 500; }
    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 6px 16px; border-radius: 50px; font-size: .78rem; font-weight: 600;
      border: 1.5px solid var(--border); background: var(--surface2);
      color: var(--muted); cursor: pointer; transition: all .18s;
      user-select: none;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.active {
      background: var(--grad-pro);
      border-color: transparent; color: #fff;
    }

    /* ── MAIN GRID ── */
    main { padding: 28px 32px; }

    /* KPI CARDS */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 28px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px; padding-right: 70px;
      position: relative; overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.4); }
    .kpi-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .kpi-card.grad::before  { background: var(--grad-pro); }
    .kpi-card.pink::before { background: var(--accent-pink); }
    .kpi-card.purple::before   { background: var(--accent-purple); }
    .kpi-card.orange::before{ background: var(--accent-orange); }

    .kpi-label { font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
    .kpi-value { font-size: 2.4rem; font-weight: 800; line-height: 1; letter-spacing: -1px; font-family: 'Comfortaa', sans-serif; }
    .kpi-value.grad   { background: var(--grad-pro); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .kpi-value.pink  { color: var(--accent-pink); }
    .kpi-value.purple    { color: var(--accent-purple); }
    .kpi-value.orange { color: var(--accent-orange); }
    .kpi-sub { font-size: .76rem; color: var(--muted); margin-top: 6px; font-family: 'Montserrat', sans-serif; }
    .kpi-pct {
      position: absolute; bottom: 20px; right: 20px;
      font-size: 1rem; font-weight: 700;
    }

    /* PROGRESS BAR */
    .prog-section {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; margin-bottom: 28px;
    }
    .prog-section h2 { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 20px; }
    .prog-bar-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .prog-label { width: 140px; font-size: .8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
    .prog-track { flex: 1; height: 10px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }
    .prog-count { width: 50px; text-align: right; font-size: .78rem; font-weight: 600; color: var(--text); flex-shrink: 0; }
    .prog-pct { width: 46px; text-align: right; font-size: .75rem; color: var(--muted); flex-shrink: 0; }

    /* CHART GRID */
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px; margin-bottom: 28px;
    }
    @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px;
    }
    .chart-card h2 { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 20px; }
    .chart-wrap { position: relative; height: 280px; }

    /* TABLE */
    .table-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; overflow-x: auto;
    }
    .table-card h2 { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    thead tr { border-bottom: 1px solid var(--border); }
    thead th { text-align: left; padding: 8px 14px; font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,.03); transition: background .15s; }
    tbody tr:hover { background: rgba(255,255,255,.04); }
    tbody td { padding: 11px 14px; color: var(--text); }
    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: .7rem; font-weight: 700;
    }
    .badge-ok     { background: rgba(255,0,108,.15); color: var(--ok); }
    .badge-danger { background: rgba(106,10,170,.15); color: var(--danger); }
    .badge-warn   { background: rgba(253,80,3,.15);  color: var(--warn); }

    /* LEGEND */
    .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: .76rem; color: var(--muted); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* EMPTY STATE */
    .empty { color: var(--muted); font-size: .85rem; padding: 40px 0; text-align: center; }

    /* LOADING */
    #loading-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999; gap: 16px;
      transition: opacity .4s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 52px; height: 52px;
      border: 4px solid rgba(252,252,252,.08);
      border-top-color: var(--accent-pink);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    #loading-overlay p { color: var(--muted); font-size: .88rem; }

    /* SCROLL TABLE */
    .table-card { max-height: 420px; overflow-y: auto; }
    .table-card::-webkit-scrollbar { width: 6px; }
    .table-card::-webkit-scrollbar-track { background: transparent; }
    .table-card::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay">
  <div class="loader-ring"></div>
  <p>Carregando dados do Google Sheets…</p>
</div>

<!-- HEADER -->
<header>
  <div class="header-left">
    <img src="logo%20novo%202026.png" alt="Protrade MKT" class="logo">
    <div>
      <h1>DASHBOARD — SKUs SAMSUNG</h1>
      <p>Efetividade de coleta por bandeira · Protrade MKT</p>
    </div>
  </div>
  <div class="header-right">
    <span id="last-updated">Aguardando…</span>
    <button id="btn-export" onclick="exportExcel()">
      <span class="icon-excel">📊</span>
      Exportar Excel
    </button>
    <button id="btn-refresh" onclick="loadData()">
      <span class="icon-refresh">↻</span>
      <span class="spin">⟳</span>
      Atualizar
    </button>
  </div>
</header>

<!-- FILTERS -->
<div id="filter-bar">
  <label>Bandeira:</label>
  <div class="chip-group" id="chips"></div>
</div>

<!-- MAIN -->
<main>
  <!-- KPIs -->
  <div class="kpi-grid" id="kpi-grid"></div>

  <!-- PROGRESS POR BANDEIRA -->
  <div class="prog-section">
    <h2>Efetividade por Bandeira</h2>
    <div id="prog-list"></div>
  </div>

  <!-- CHARTS -->
  <div class="chart-grid">
    <div class="chart-card">
      <h2>Distribuição de Status (Geral)</h2>
      <div class="chart-wrap"><canvas id="donutChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h2>Coleta por Bandeira</h2>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <h2>Listagem de PDVs <span id="table-count" style="color:var(--muted);font-weight:400;font-size:.78rem;text-transform:none;letter-spacing:0;"></span></h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Bandeira</th>
          <th>Nome do PDV</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const SHEET_ID   = '11FtS39zfBRvGz89Ld3JRVDUrvzK7xKJSNQuZBSbKF_0';
  const API_KEY    = ''; // deixado vazio

  // Lógica Mística inteligente: Se estiver no seu computador, usa o arquivo. Se estiver na nuvem (Vercel), usa "Ao Vivo".
  const IS_LOCAL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const DATA_URL = IS_LOCAL ? './data.json' : '/api/data';

  const STATUS_OK    = 'Coletado';
  const STATUS_MISS  = 'Falta coletar';
  const STATUS_VIAGEM = 'SEM VISITAS - VIAGEM';

  // Paleta das bandeiras (Cores Primárias e Secundárias PROTRADE)
  const BANDEIRA_COLORS = [
    '#FF006C', '#6A0AAA', '#FD5003', '#FFB6E3', '#C5BDFF', '#F9A58F', '#CC649F', '#685AAF', '#E47855'
  ];

  Chart.register(ChartDataLabels);

  let allData = [];
  let activeBandeira = 'TODAS';
  let donutChart, barChart;

  // ── LOAD ────────────────────────────────────────────────────────────────────
  async function loadData() {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('loading');

    try {
      const res = await fetch(DATA_URL + '?t=' + Date.now());
      if (!res.ok) throw new Error('Falha de conexão com a API Serverless (/api/data). Verifique se as variáveis de ambiente foram configuradas na Vercel.');
      allData = await res.json();

      document.getElementById('last-updated').textContent =
        'Atualizado: ' + new Date().toLocaleString('pt-BR');

      buildFilters();
      render();
    } catch(e) {
      alert('Erro ao carregar dados: ' + e.message + '\n\nCertifique-se de executar o servidor HTTP local (npx serve ou Live Server).');
    } finally {
      btn.classList.remove('loading');
      document.getElementById('loading-overlay').classList.add('hidden');
    }
  }

  // ── FILTERS ─────────────────────────────────────────────────────────────────
  function buildFilters() {
    const bandeiras = ['TODAS', ...new Set(allData.map(d => d.bandeira).filter(Boolean).sort())];
    const container = document.getElementById('chips');
    container.innerHTML = '';
    bandeiras.forEach(b => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (b === activeBandeira ? ' active' : '');
      chip.textContent = b;
      chip.onclick = () => { activeBandeira = b; buildFilters(); render(); };
      container.appendChild(chip);
    });
  }

  // ── FILTER DATA ──────────────────────────────────────────────────────────────
  function filtered() {
    if (activeBandeira === 'TODAS') return allData;
    return allData.filter(d => d.bandeira === activeBandeira);
  }

  // ── RENDER ───────────────────────────────────────────────────────────────────
  function render() {
    const data = filtered();
    renderKPIs(data);
    renderProgress(data);
    renderDonut(data);
    renderBar(data);
    renderTable(data);
  }

  // KPIs
  function renderKPIs(data) {
    const total   = data.length;
    const colet   = data.filter(d => d.situacao === STATUS_OK).length;
    const falta   = data.filter(d => d.situacao === STATUS_MISS).length;
    const viagem  = data.filter(d => d.situacao === STATUS_VIAGEM).length;
    
    // Novo cálculo de Efetividade: Removemos as 'Viagens' da base obrigatória
    const elegiveis = total - viagem;
    const pct     = elegiveis > 0 ? ((colet / elegiveis) * 100).toFixed(1) : 0;
    const pctFalta = elegiveis > 0 ? ((falta / elegiveis) * 100).toFixed(1) : 0;

    document.getElementById('kpi-grid').innerHTML = `
      <div class="kpi-card grad">
        <div class="kpi-label">Total de Lojas (Elegíveis)</div>
        <div class="kpi-value grad">${elegiveis}</div>
        <div class="kpi-sub">${activeBandeira === 'TODAS' ? 'TODAS AS BANDEIRAS' : activeBandeira}</div>
      </div>
      <div class="kpi-card pink">
        <div class="kpi-label">Efetividade</div>
        <div class="kpi-value pink">${colet}</div>
        <div class="kpi-sub">SKU já coletados</div>
        <div class="kpi-pct" style="color:var(--accent-pink)">${pct}%</div>
      </div>
      <div class="kpi-card purple">
        <div class="kpi-label">Falta Coletar</div>
        <div class="kpi-value purple">${falta}</div>
        <div class="kpi-sub">Dentro das elegíveis</div>
        <div class="kpi-pct" style="color:var(--accent-purple)">${pctFalta}%</div>
      </div>
      <div class="kpi-card orange">
        <div class="kpi-label">Sem Visitas / Viagem</div>
        <div class="kpi-value orange">${viagem}</div>
        <div class="kpi-sub">Lojas descartadas</div>
        <div class="kpi-pct" style="color:var(--accent-orange)">${total ? ((viagem/total)*100).toFixed(1) : 0}%</div>
      </div>
    `;
  }

  // PROGRESS POR BANDEIRA
  function renderProgress(data) {
    const bandeiras = [...new Set(data.map(d => d.bandeira).filter(Boolean))].sort();
    const list = document.getElementById('prog-list');

    if (!bandeiras.length) { list.innerHTML = '<div class="empty">Nenhum dado</div>'; return; }

    list.innerHTML = bandeiras.map((b, i) => {
      const rows  = data.filter(d => d.bandeira === b);
      const total = rows.length;
      const colet = rows.filter(d => d.situacao === STATUS_OK).length;
      
      const pct   = total ? ((colet / total) * 100).toFixed(1) : 0;
      const color = BANDEIRA_COLORS[i % BANDEIRA_COLORS.length];

      return `
        <div class="prog-bar-wrap">
          <div class="prog-label" title="${b}">${b}</div>
          <div class="prog-track">
            <div class="prog-fill" style="width:${pct}%;background:${color};"></div>
          </div>
          <div class="prog-count">${colet}/${total}</div>
          <div class="prog-pct">${pct}%</div>
        </div>`;
    }).join('');
  }

  // DONUT
  function renderDonut(data) {
    const colet  = data.filter(d => d.situacao === STATUS_OK).length;
    const falta  = data.filter(d => d.situacao === STATUS_MISS).length;
    const viagem = data.filter(d => d.situacao === STATUS_VIAGEM).length;

    const cfg = {
      type: 'doughnut',
      data: {
        labels: ['Coletado', 'Falta Coletar', 'Sem Visitas / Viagem'],
        datasets: [{
          data: [colet, falta, viagem],
          backgroundColor: ['rgba(255,0,108,.85)', 'rgba(106,10,170,.85)', 'rgba(253,80,3,.85)'],
          borderColor: '#1a1a1a',
          borderWidth: 3,
          hoverOffset: 8,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '72%',
        plugins: {
          datalabels: {
            color: '#fff',
            display: function(context) { return context.dataset.data[context.dataIndex] > 0; },
            font: { weight: 'bold', size: 11, family: 'Montserrat' },
            formatter: (value) => {
              const pct = ((value / data.length) * 100).toFixed(1);
              return value + ' (' + pct + '%)';
            }
          },
          legend: { position: 'bottom', labels: { color: '#a0a0a0', font: { size: 12, family: 'Montserrat' }, padding: 18, usePointStyle: true, pointStyleWidth: 8 } },
          tooltip: { callbacks: {
            label: ctx => ` ${ctx.label}: ${ctx.parsed} (${data.length ? ((ctx.parsed / data.length)*100).toFixed(1) : 0}%)`
          }}
        }
      }
    };

    if (donutChart) donutChart.destroy();
    donutChart = new Chart(document.getElementById('donutChart'), cfg);
  }

  // BAR
  function renderBar(data) {
    const bandeiras = [...new Set(data.map(d => d.bandeira).filter(Boolean))].sort();
    const coletados = bandeiras.map(b => data.filter(d => d.bandeira === b && d.situacao === STATUS_OK).length);
    const faltantes = bandeiras.map(b => data.filter(d => d.bandeira === b && d.situacao === STATUS_MISS).length);
    const viagens   = bandeiras.map(b => data.filter(d => d.bandeira === b && d.situacao === STATUS_VIAGEM).length);

    const cfg = {
      type: 'bar',
      data: {
        labels: bandeiras,
        datasets: [
          { label: 'Coletado', data: coletados, backgroundColor: 'rgba(255,0,108,.85)', borderRadius: 6, borderSkipped: false, minBarLength: 15 },
          { label: 'Falta Coletar', data: faltantes, backgroundColor: 'rgba(106,10,170,.85)', borderRadius: 6, borderSkipped: false, minBarLength: 15 },
          { label: 'Sem Visitas', data: viagens, backgroundColor: 'rgba(253,80,3,.85)', borderRadius: 6, borderSkipped: false, minBarLength: 15 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          datalabels: {
            color: '#fff',
            anchor: 'center',
            align: 'center',
            display: function(context) { return context.dataset.data[context.dataIndex] > 0; },
            font: { weight: 'bold', size: 10, family: 'Montserrat' },
            formatter: (value) => value
          },
          legend: { position: 'bottom', labels: { color: '#a0a0a0', font: { size: 12, family: 'Montserrat' }, padding: 16, usePointStyle: true, pointStyleWidth: 8 } },
        },
        scales: {
          x: { stacked: true, ticks: { color: '#a0a0a0', font: { size: 11, family: 'Montserrat' } }, grid: { color: 'rgba(252,252,252,.04)' } },
          y: { stacked: true, ticks: { color: '#a0a0a0', font: { size: 11, family: 'Montserrat' } }, grid: { color: 'rgba(252,252,252,.06)' }, beginAtZero: true },
        }
      }
    };

    if (barChart) barChart.destroy();
    barChart = new Chart(document.getElementById('barChart'), cfg);
  }

  // TABLE
  function renderTable(data) {
    const tbody = document.getElementById('tbody');
    
    // Mostra o total oficial desconsiderando as viagens também igual ao painel
    const viagensNaLista = data.filter(d => d.situacao === STATUS_VIAGEM).length;
    document.getElementById('table-count').textContent = `(${data.length - viagensNaLista} Elegíveis)`;

    if (!data.length) { tbody.innerHTML = `<tr><td colspan="4" class="empty">Nenhum PDV encontrado</td></tr>`; return; }

    tbody.innerHTML = data.map((d, i) => {
      let badge, bClass;
      if (d.situacao === STATUS_OK)     { badge = 'Coletado';            bClass = 'badge-ok'; }
      else if (d.situacao === STATUS_MISS)  { badge = 'Falta Coletar';       bClass = 'badge-danger'; }
      else                               { badge = 'Sem Visitas / Viagem'; bClass = 'badge-warn'; }

      return `
        <tr>
          <td style="color:var(--muted);width:40px">${i + 1}</td>
          <td><strong>${d.bandeira || '—'}</strong></td>
          <td>${d.nomePdvNovo || d.nomePdvAntigo || '—'}</td>
          <td><span class="status-badge ${bClass}">${badge}</span></td>
        </tr>`;
    }).join('');
  }

  // ── EXPORT EXCEL ────────────────────────────────────────────────────────────
  function exportExcel() {
    if (!allData || !allData.length) {
      alert("Nenhum dado disponível para exportar.");
      return;
    }
    
    const dataToExport = allData.map(d => ({
      "Responsável": d.responsavel,
      "Cliente": d.cliente,
      "Bandeira": d.bandeira,
      "Nome do PDV Novo": d.nomePdvNovo,
      "De Para Com A Coleta": d.deParaColeta,
      "Nome PDV Antigo": d.nomePdvAntigo,
      "Cidade": d.cidade,
      "Estado": d.estado,
      "Região": d.regiao,
      "Situação": d.situacao
    }));

    const ws = XLSX.utils.json_to_sheet(dataToExport);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Base de Lojas");
    
    // Auto-ajustar a largura das colunas baseando-se no Header
    const colWidths = Object.keys(dataToExport[0]).map(key => ({ wch: Math.max(15, key.length + 5) }));
    ws['!cols'] = colWidths;
    
    const d = new Date();
    const fileName = `Relatorio_SKU_Samsung_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`;
    
    XLSX.writeFile(wb, fileName);
  }

  // ── INIT ─────────────────────────────────────────────────────────────────────
  loadData();
</script>
</body>
</html>
